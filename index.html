<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VLZ Barber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* Layout: banda negra con el logo y el botón de tema, franja de poste de barbero como divisor, luego catálogo con fotos, lista de servicios y barra fija abajo con total y WhatsApp. Colores tomados del logo: negro, dorado y poste rojo/blanco/azul. */
:root {
  --bg: #f1f1ef;
  --surface: #ffffff;
  --fg: #121214;
  --muted: #5a5a62;
  --line: #d8d7d2;
  --accent: #b8860b;
  --accent-fg: #14110a;
  --gold-text: #8a6410;
  --navy: #1d3557;
  --pole-white: #f5f5f5;
  --pole-red: #e3242f;
  --pole-blue: #2f6bff;
  --band: #0b0b0d;
  --band-fg: #f2efe6;
  --band-line: rgba(242, 239, 230, 0.35);

  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d;
    --surface: #16161a;
    --fg: #f2efe6;
    --muted: #a5a3aa;
    --line: #2b2b32;
    --accent: #e3b341;
    --accent-fg: #14110a;
    --gold-text: #e3b341;
    --navy: #7fa6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0d;
  --surface: #16161a;
  --fg: #f2efe6;
  --muted: #a5a3aa;
  --line: #2b2b32;
  --accent: #e3b341;
  --accent-fg: #14110a;
  --gold-text: #e3b341;
  --navy: #7fa6ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 168px;
}
.wrap { max-width: 560px; margin-inline: auto; }

.band {
  background: var(--band);
  color: var(--band-fg);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-in { max-width: 560px; margin-inline: auto; padding-block: 12px 22px; }
.topbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.tema {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--band-fg);
  background: transparent;
  border: 1px solid var(--band-line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tema:focus-visible { outline: 3px solid #e3b341; outline-offset: 2px; }
.tema svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.logo { margin: 0; font-size: 0; line-height: 0; }
.logo img { display: block; width: min(100%, 380px); height: auto; margin-inline: auto; border-radius: 6px; }

.pole {
  height: 14px;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background: repeating-linear-gradient(-45deg,
    var(--pole-red) 0 10px, var(--pole-white) 10px 20px,
    var(--pole-blue) 20px 30px, var(--pole-white) 30px 40px);
}

header { padding-block: 22px 4px; }
.lead { margin: 0 0 14px; color: var(--muted); max-width: 40ch; }
.hours {
  display: inline-block;
  font-size: 14px;
  font-weight: 500;
  padding: 6px 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-variant-numeric: tabular-nums;
}

section { padding-top: 28px; }
h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold-text);
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}
h2::after { content: ""; flex: 1; height: 2px; background: var(--line); }

.list { display: grid; gap: 10px; }

.svc {
  appearance: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 14px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 26px;
  align-items: center;
  column-gap: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.svc:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.svc[aria-pressed="true"] {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
}
.svc-name { display: block; font-size: 18px; font-weight: 600; }
.svc-desc { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.svc-meta {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.svc-price {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 30px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.svc-check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
}
.svc[aria-pressed="true"] .svc-check { background: var(--accent); border-color: var(--accent); }
.svc[aria-pressed="true"] .svc-check::after {
  content: "";
  width: 6px;
  height: 11px;
  border: solid var(--accent-fg);
  border-width: 0 2.5px 2.5px 0;
  transform: translateY(-1px) rotate(45deg);
}

.hint { margin: -2px 0 12px; font-size: 14px; color: var(--muted); }
.gallery {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 10px;
}
.shot {
  flex: 0 0 62%;
  max-width: 240px;
  scroll-snap-align: start;
  appearance: none;
  padding: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.shot:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.shot[aria-pressed="true"] { border-color: var(--accent); }
.shot-img, .shot-ph { display: block; width: 100%; aspect-ratio: 3 / 4; }
.shot-img { object-fit: cover; background: var(--line); }
.shot-ph {
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 44px;
  letter-spacing: 0.08em;
  color: var(--muted);
  background: var(--line);
}
.shot-cap {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 10px 12px;
}
.shot-name { font-weight: 600; min-width: 0; }
.shot-price { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.shot[aria-pressed="true"] .shot-cap { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

.name-field { display: grid; gap: 6px; }
.name-field label { font-weight: 600; }
.name-field input {
  font: inherit;
  color: var(--fg);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
  width: 100%;
}
.name-field input:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; border-color: var(--navy); }

.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  background: var(--surface);
  border-top: 2px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in {
  max-width: 560px;
  margin-inline: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
}
.summary { flex: 1 1 140px; min-width: 0; }
.summary-total {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 32px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.summary-sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cta {
  flex: 1 1 200px;
  text-align: center;
  text-decoration: none;
  font-weight: 600;
  font-size: 17px;
  padding: 14px 18px;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-fg);
  border: 2px solid var(--accent);
}
.cta:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.cta[aria-disabled="true"] {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  .svc { transition: border-color 0.12s, background-color 0.12s; }
}
</style>

<div class="band">
  <div class="band-in">
    <div class="topbar">
      <button class="tema" id="tema" type="button" aria-label="Cambiar a modo claro">
        <svg id="ico-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="ico-luna" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
        <span id="tema-txt">Modo claro</span>
      </button>
    </div>
    <h1 class="logo"><img src="fotos/logo.jpg" alt="VLZ Barber Shop" width="900" height="900"></h1>
  </div>
</div>
<div class="pole" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <p class="lead">Elegí tu corte y pedí tu turno por WhatsApp. Podés marcar más de un servicio.</p>
    <span class="hours">Lun a Sáb · 9:00 a 19:00</span>
  </header>

  <section>
    <h2>Catálogo</h2>
    <p class="hint">Deslizá para ver más y tocá el que te guste para elegirlo.</p>
    <div class="gallery" id="galeria"></div>
  </section>

  <main id="menu"></main>

  <section>
    <div class="name-field">
      <label for="nombre">Tu nombre (opcional)</label>
      <input id="nombre" type="text" autocomplete="given-name" placeholder="Para saber quién escribe">
    </div>
  </section>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="summary" aria-live="polite">
      <div class="summary-total" id="total">Q0</div>
      <div class="summary-sub" id="sub">Elegí tu corte</div>
    </div>
    <a class="cta" id="cta" href="#" target="_blank" rel="noopener" aria-disabled="true">Pedir por WhatsApp</a>
  </div>
</div>

<script>
/* Cambiá estos datos para personalizar la página. */
var TELEFONO = "50250579995"; /* código de país + número, sin + ni espacios */
var CATALOGO = [
  { grupo: "Cortes", items: [
    { id: "clasico", nombre: "Corte clásico", desc: "Tijera y máquina, con acabado de navaja en el cuello.", precio: 15, min: 30 },
    { id: "degradado", nombre: "Degradado", desc: "Fade bajo, medio o alto, a tu gusto.", precio: 20, min: 40 },
    { id: "tijera", nombre: "Corte a tijera", desc: "Todo el corte con tijera, para cabello largo o medio.", precio: 25, min: 45 },
    { id: "nino", nombre: "Corte de niño", desc: "Hasta 12 años.", precio: 15, min: 25 }
  ]},
  { grupo: "Barba", items: [
    { id: "perfilado", nombre: "Perfilado de barba", desc: "Recorte y líneas definidas con navaja.", precio: 10, min: 20 }
  ]},
  { grupo: "Combos", items: [
    { id: "combo1", nombre: "Corte + barba", desc: "Corte a elección y perfilado de barba.", precio: 30, min: 50 },
    { id: "combo2", nombre: "Corte + cejas", desc: "Corte a elección y perfilado de cejas.", precio: 25, min: 35 }
  ]}
];

var elegidos = {};
var porId = {};
var menu = document.getElementById("menu");

CATALOGO.forEach(function (g) {
  var sec = document.createElement("section");
  var h = document.createElement("h2");
  h.textContent = g.grupo;
  var lista = document.createElement("div");
  lista.className = "list";
  g.items.forEach(function (it) {
    porId[it.id] = it;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "svc";
    b.setAttribute("aria-pressed", "false");
    b.dataset.id = it.id;
    b.innerHTML =
      '<span><span class="svc-name"></span><span class="svc-desc"></span><span class="svc-meta"></span></span>' +
      '<span class="svc-price"></span><span class="svc-check" aria-hidden="true"></span>';
    b.querySelector(".svc-name").textContent = it.nombre;
    b.querySelector(".svc-desc").textContent = it.desc;
    b.querySelector(".svc-meta").textContent = it.min + " min";
    b.querySelector(".svc-price").textContent = "Q" + it.precio;
    b.addEventListener("click", function () { alternar(it.id); });
    lista.appendChild(b);
  });
  sec.appendChild(h);
  sec.appendChild(lista);
  menu.appendChild(sec);
});

/* Fotos de referencia: una por servicio, con la ruta del archivo. */
var FOTOS = {
  clasico: "fotos/clasico.jpg",
  degradado: "fotos/degradado.jpg",
  tijera: "fotos/tijera.jpg",
  nino: "fotos/nino.jpg",
  perfilado: "fotos/perfilado.jpg"
};
var GALERIA = ["clasico", "degradado", "tijera", "nino", "perfilado"];
var galeria = document.getElementById("galeria");
GALERIA.forEach(function (id) {
  var it = porId[id];
  var b = document.createElement("button");
  b.type = "button";
  b.className = "shot";
  b.setAttribute("aria-pressed", "false");
  b.dataset.id = id;
  var visual;
  if (FOTOS[id]) {
    visual = document.createElement("img");
    visual.className = "shot-img";
    visual.src = FOTOS[id];
    visual.alt = it.nombre;
    visual.loading = "lazy";
  } else {
    visual = document.createElement("span");
    visual.className = "shot-ph";
    visual.setAttribute("aria-hidden", "true");
    visual.textContent = "VLZ";
  }
  var cap = document.createElement("span");
  cap.className = "shot-cap";
  var n = document.createElement("span");
  n.className = "shot-name";
  n.textContent = it.nombre;
  var p = document.createElement("span");
  p.className = "shot-price";
  p.textContent = "Q" + it.precio;
  cap.appendChild(n);
  cap.appendChild(p);
  b.appendChild(visual);
  b.appendChild(cap);
  b.addEventListener("click", function () { alternar(id); });
  galeria.appendChild(b);
});

function alternar(id) {
  if (elegidos[id]) { delete elegidos[id]; } else { elegidos[id] = true; }
  actualizar();
}

var totalEl = document.getElementById("total");
var subEl = document.getElementById("sub");
var cta = document.getElementById("cta");
var nombreEl = document.getElementById("nombre");

function actualizar() {
  var ids = Object.keys(elegidos);
  document.querySelectorAll("[data-id]").forEach(function (el) {
    el.setAttribute("aria-pressed", elegidos[el.dataset.id] ? "true" : "false");
  });
  var total = 0, min = 0, nombres = [];
  ids.forEach(function (id) {
    total += porId[id].precio;
    min += porId[id].min;
    nombres.push(porId[id].nombre);
  });
  totalEl.textContent = "Q" + total;
  if (!ids.length) {
    subEl.textContent = "Elegí tu corte";
    cta.setAttribute("aria-disabled", "true");
    cta.setAttribute("href", "#");
    return;
  }
  subEl.textContent = ids.length + (ids.length === 1 ? " servicio" : " servicios") + " · " + min + " min";
  var nombre = nombreEl.value.trim();
  var msg = "Hola, quiero agendar un turno.\n" +
    "Servicios: " + nombres.join(", ") + "\n" +
    "Total: Q" + total + " (aprox. " + min + " min)" +
    (nombre ? "\nMi nombre: " + nombre : "");
  cta.setAttribute("href", "https://wa.me/" + TELEFONO + "?text=" + encodeURIComponent(msg));
  cta.removeAttribute("aria-disabled");
}
nombreEl.addEventListener("input", actualizar);
actualizar();

/* Botón de modo claro u oscuro */
var raiz = document.documentElement;
var btnTema = document.getElementById("tema");
var txtTema = document.getElementById("tema-txt");
var icoSol = document.getElementById("ico-sol");
var icoLuna = document.getElementById("ico-luna");

function temaActual() {
  var t = raiz.getAttribute("data-theme");
  if (t === "dark" || t === "light") { return t; }
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function pintarBoton() {
  var oscuro = temaActual() === "dark";
  txtTema.textContent = oscuro ? "Modo claro" : "Modo oscuro";
  icoSol.hidden = !oscuro;
  icoLuna.hidden = oscuro;
  btnTema.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
}
try {
  var guardado = localStorage.getItem("vlz-tema");
  if (guardado === "dark" || guardado === "light") { raiz.setAttribute("data-theme", guardado); }
} catch (e) {}
btnTema.addEventListener("click", function () {
  var nuevo = temaActual() === "dark" ? "light" : "dark";
  raiz.setAttribute("data-theme", nuevo);
  try { localStorage.setItem("vlz-tema", nuevo); } catch (e) {}
  pintarBoton();
});
try {
  new MutationObserver(pintarBoton).observe(raiz, { attributes: true, attributeFilter: ["data-theme"] });
} catch (e) {}
pintarBoton();
</script>

</body></html>
